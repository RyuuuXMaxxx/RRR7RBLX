<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<header>

    <div class="logo-box">
        <img src="assets/logo.png" alt="RRR7 MARKET ROBUX">
    </div>

    <h1>RRR7 MARKET ROBUX</h1>

    <p>Top up Robux cepat, mudah, dan aman.</p>

</header>
<div class="card">

    <h2>Welcome Store RRR7RBLX</h2>

    <p>⚡ Proses cepat.</p>

    <p>💎 Harga terjangkau.</p>

    <p>🛡️ Aman dan terpercaya.</p>

    <p>📱 Layanan pelanggan aktif.</p>

</div>
<div class="container">

    <div class="card">
        <h2>Username Roblox</h2>
<div class="card">
    <h2>Nomor WhatsApp</h2>

    <input
        id="whatsapp"
        type="text"
        placeholder="08xxxxxxxxxx">
</div>
        <input
            type="text"
            placeholder="Masukkan Username Roblox Kamu">
    </div>

    <div class="card">

        <button>100 Robux — Rp13.500</button>

        <button>300 Robux — Rp40.500</button>
        <button>400 Robux — Rp53.500</button>
        <button>500 Robux — Rp67.500</button>
        <button>1000 Robux — Rp135.000</button>


<!-- Tambahkan kode di sini -->

<div class="card">

    <h2>Metode Pembayaran</h2>

    <label class="payment-box">
        <input type="radio" name="payment">
        SeaBank
    </label>

    <label class="payment-box">
        <input type="radio" name="payment">
        QRIS
    </label>

</div>

<!-- Ringkasan pesanan -->

<div class="card">

    <h2>Ringkasan Pesanan</h2>
<button class="buy-button" onclick="checkout()">
    Beli Sekarang
</button>
    <p>Produk: <span id="produk">-</span></p>

    <p>Total: <span id="harga">Rp0</span></p>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
